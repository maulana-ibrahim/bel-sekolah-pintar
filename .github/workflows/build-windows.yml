name: Build Windows installer

# Manual run from the Actions tab (installer as a build artifact), or a version
# tag (git tag v0.1.0 && git push origin v0.1.0) which also publishes a GitHub
# Release with the installers attached.
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: write # create the Release on tag builds

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      # Same checks as local: TypeScript data rules + Rust store/scheduler/sounds.
      - run: pnpm test
      - run: pnpm tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: bel-sekolah-pintar-windows
          path: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          if-no-files-found: error
      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Bel Sekolah Pintar ${{ github.ref_name }}
          body: |
            Installer Windows (64-bit). Pilih salah satu:
            - `*-setup.exe` — installer biasa (disarankan)
            - `*.msi` — untuk instalasi lewat kebijakan IT sekolah

            Installer belum ditandatangani digital, jadi Windows SmartScreen bisa menampilkan
            "Windows protected your PC". Klik "More info" → "Run anyway".
          files: |
            src-tauri/target/release/bundle/nsis/*.exe
            src-tauri/target/release/bundle/msi/*.msi
          fail_on_unmatched_files: true
